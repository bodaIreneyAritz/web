server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dev: evita cache agressiu mentre itereu
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
